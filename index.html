    <!-- Critical CSS inlined for faster FCP -->
    <style>
      * { box-sizing: border-box; }
      body { 
        margin: 0; 
        padding: 0; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: hsl(0 0% 100%);
        color: hsl(222.2 84% 4.9%);
        line-height: 1.5;
        position: relative;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }
      #root { 
        min-height: 100vh; 
        position: relative;
        z-index: 1;
      }
      .dark body { 
        background: hsl(222.2 84% 4.9%); 
        color: hsl(210 40% 98%); 
      }
      
      /* Critical layout styles */
      .min-h-screen { min-height: 100vh; }
      .max-w-7xl { max-width: 80rem; }
      .mx-auto { margin-left: auto; margin-right: auto; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
      .flex { display: flex; }
      .grid { display: grid; }
      .block { display: block; }
      .hidden { display: none; }
      .w-full { width: 100%; }
      .text-center { text-align: center; }
      .font-bold { font-weight: 700; }
      .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
      .mb-4 { margin-bottom: 1rem; }
      .mb-6 { margin-bottom: 1.5rem; }
      .space-y-4 > * + * { margin-top: 1rem; }
      
      /* Prevent layout shift */
      img { max-width: 100%; height: auto; }
      .aspect-video { aspect-ratio: 16 / 9; }
      
      /* Loading state */
      .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }
      
      /* Additional critical styles for above-the-fold content */
      .transition-all { transition: all 0.3s ease; }
      .hover\:scale-\[1\.02\]:hover { transform: scale(1.02); }
      .rounded-lg { border-radius: 0.5rem; }
      .overflow-hidden { overflow: hidden; }
      .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
      .object-cover { object-fit: cover; }
      .opacity-90 { opacity: 0.9; }
      .opacity-75 { opacity: 0.75; }
      .line-clamp-3 { 
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
      .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
      .font-serif { font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif; }
      .gap-8 { gap: 2rem; }
      .items-center { align-items: center; }
      .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
      .lg\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .order-1 { order: 1; }
      .order-2 { order: 2; }
      .lg\:order-1 { order: 1; }
      .lg\:order-2 { order: 2; }
      @media (min-width: 1024px) {
        .lg\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .lg\:order-1 { order: 1; }
        .lg\:order-2 { order: 2; }
      }
     </style>
     
     <!-- Enhanced CSS non-blocking strategy -->
     <script>
       // Intercept CSS loading immediately to prevent render blocking
       (function() {
         // Override document.write to catch Vite CSS injection
         const originalWrite = document.write;
         document.write = function(content) {
           if (content.includes('rel="stylesheet"') && content.includes('assets/index-')) {
             // Convert to preload + async loading
             const match = content.match(/href="([^"]+)"/);
             if (match) {
               const href = match[1];
               const link = document.createElement('link');
               link.rel = 'preload';
               link.as = 'style';
               link.href = href;
               link.onload = function() {
                 this.rel = 'stylesheet';
               };
               document.head.appendChild(link);
               return;
             }
           }
           originalWrite.call(document, content);
         };
         
         // Fallback for existing stylesheets
         const observer = new MutationObserver(function(mutations) {
           mutations.forEach(function(mutation) {
             mutation.addedNodes.forEach(function(node) {
               if (node.nodeType === 1 && node.tagName === 'LINK' && 
                   node.rel === 'stylesheet' && node.href.includes('assets/index-')) {
                 const href = node.href;
                 const newLink = document.createElement('link');
                 newLink.rel = 'preload';
                 newLink.as = 'style';
                 newLink.href = href;
                 newLink.onload = function() {
                   this.rel = 'stylesheet';
                   node.remove();
                 };
                 document.head.insertBefore(newLink, node);
               }
             });
           });
         });
         observer.observe(document.head, { childList: true });
       })();
     </script>
    
    <!-- Preload fonts for faster loading -->
