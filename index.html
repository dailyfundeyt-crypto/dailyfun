
<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/lovable-uploads/1e980cfa-2691-4008-bce0-c91dac549aa3.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daily Fun - Your source for engaging news, AI insights, and entertaining content. Stay informed and entertained with our curated articles and interactive features." />
    <title>Daily Fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"></noscript>
    <script>
      (function(){
        try {
          var t = localStorage.getItem('theme') || 'light';
          var root = document.documentElement;
          root.classList.remove('dark','light','theme-red','theme-blue','theme-green','theme-yellow','theme-orange','theme-pink');
          if (t === 'dark') {
            root.classList.add('dark');
          } else if (t === 'light') {
            root.classList.add('light');
          } else {
            root.classList.add('theme-' + t);
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://js.puter.com/v2/" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
