
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/lovable-uploads/1e980cfa-2691-4008-bce0-c91dac549aa3.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daily Fun - Your source for engaging news, AI insights, and entertaining content. Stay informed and entertained with our curated articles and interactive features." />
    <title>Daily Fun</title>
    
    <!-- Resource hints for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://js.puter.com">
    
    <!-- Preload critical LCP image for faster paint -->
    <link rel="preload" as="image" href="/lovable-uploads/086cd655-8903-494a-b43f-1041c272916b.png" type="image/png" fetchpriority="high">
    <link rel="preload" as="image" href="/lovable-uploads/1e980cfa-2691-4008-bce0-c91dac549aa3.png" type="image/png">
    <link rel="preload" as="image" href="/lovable-uploads/41e6954d-801e-45ba-9029-5eeebebddccb.png" type="image/png" fetchpriority="high">
    
    <!-- Critical CSS inlined for faster FCP -->
    <style>
      * { box-sizing: border-box; }
      body { 
        margin: 0; 
        padding: 0; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: hsl(0 0% 100%);
        color: hsl(222.2 84% 4.9%);
        line-height: 1.5;
        position: relative;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }
      #root { 
        min-height: 100vh; 
        position: relative;
        z-index: 1;
      }
      .dark body { 
        background: hsl(222.2 84% 4.9%); 
        color: hsl(210 40% 98%); 
      }
      
      /* Critical layout styles */
      .min-h-screen { min-height: 100vh; }
      .max-w-7xl { max-width: 80rem; }
      .mx-auto { margin-left: auto; margin-right: auto; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
      .flex { display: flex; }
      .grid { display: grid; }
      .block { display: block; }
      .hidden { display: none; }
      .w-full { width: 100%; }
      .text-center { text-align: center; }
      .font-bold { font-weight: 700; }
      .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
      .mb-4 { margin-bottom: 1rem; }
      .mb-6 { margin-bottom: 1.5rem; }
      .space-y-4 > * + * { margin-top: 1rem; }
      
      /* Prevent layout shift */
      img { max-width: 100%; height: auto; }
      .aspect-video { aspect-ratio: 16 / 9; }
      
      /* Loading state */
      .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }
    </style>
    
    <!-- Make CSS non-blocking -->
    <script>
      // Convert render-blocking CSS to non-blocking
      document.addEventListener('DOMContentLoaded', function() {
        const links = document.querySelectorAll('link[rel="stylesheet"]');
        links.forEach(link => {
          if (link.href && !link.dataset.async) {
            const newLink = document.createElement('link');
            newLink.rel = 'preload';
            newLink.as = 'style';
            newLink.href = link.href;
            newLink.onload = function() {
              this.rel = 'stylesheet';
            };
            link.parentNode.insertBefore(newLink, link);
            link.remove();
          }
        });
      });
    </script>
    
    <!-- Preload fonts for faster loading -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://js.puter.com/v2/" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
